[package]
name = "fipa-acl"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "A clean, standards-compliant FIPA-ACL (Agent Communication Language) message model for Rust: the 22 standard performatives, the full message envelope, and the FIPA string encoding."
license = "MIT OR Apache-2.0"
keywords = ["fipa", "acl", "multi-agent", "agent", "protocol"]
categories = ["network-programming"]
repository = "https://github.com/hamid754/fipa-acl"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
